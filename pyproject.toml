[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm"
version = "0.1.0"
description = "Information throttling benchmarks for decentralized swarms"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pettingzoo[mpe]>=1.24",
  "PyYAML>=6.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
